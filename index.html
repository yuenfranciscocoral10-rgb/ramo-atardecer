<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un detalle para ti 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cielo del atardecer -->
    <div class="cielo"></div>

    <!-- Estrellitas y partículas -->
    <div class="particulas"></div>

    <!-- Contenido principal -->
    <main class="escena">

        <div class="texto-inicial">
            <p class="pequeno">Hay algo que preparé para ti...</p>
            <h1>Un pequeño detalle 🌻</h1>
        </div>

        <!-- Aquí aparecerá nuestro ramo -->
        <div class="ramo">

            <!-- Flores -->
            <div class="flor flor-1">
                <div class="petalos">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div class="centro"></div>
            </div>

            <div class="flor flor-2">
                <div class="petalos">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div class="centro"></div>
            </div>

            <div class="flor flor-3">
                <div class="petalos">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div class="centro"></div>
            </div>

            <div class="flor flor-4">
                <div class="petalos">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div class="centro"></div>
            </div>

            <div class="flor flor-5">
                <div class="petalos">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div class="centro"></div>
            </div>

            <div class="flor flor-6">
                <div class="petalos">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div class="centro"></div>
            </div>

            <!-- Tallos -->
            <div class="tallo tallo-1"></div>
            <div class="tallo tallo-2"></div>
            <div class="tallo tallo-3"></div>
            <div class="tallo tallo-4"></div>
            <div class="tallo tallo-5"></div>
            <div class="tallo tallo-6"></div>

            <!-- Hojas -->
            <div class="hoja hoja-1"></div>
            <div class="hoja hoja-2"></div>
            <div class="hoja hoja-3"></div>
            <div class="hoja hoja-4"></div>
            <div class="hoja hoja-5"></div>

            <!-- Envoltura -->
            <div class="envoltura">
                <div class="papel papel-izquierdo"></div>
                <div class="papel papel-derecho"></div>
                <div class="lazo"></div>
            </div>

        </div>

        <!-- Botón de sorpresa -->
        <button id="botonSorpresa">
            Hay algo para ti 💛
        </button>

        <!-- Carta -->
        <div id="carta" class="carta">

            <div class="carta-contenido">

                <button id="cerrarCarta" class="cerrar">×</button>

                <div class="corazon">♡</div>

                <p id="mensajeCarta"></p>

            </div>

        </div>

    </main>

    <!-- Pétalos que caerán por la pantalla -->
    <div id="petalosCaidos"></div>

    <script src="script.js"></script>

</body>

</html>
